[package]
name = "datastream-schema-registry"
description = "Confluent and AWS Glue Schema Registry wire-format framing streams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Unframe `datastream-kafka` consumer messages, keeping their other fields.
kafka = ["dep:datastream-kafka"]
# `confluent_schema_registry_resolver` (HTTP lookups via reqwest).
resolver = ["dep:futures", "dep:reqwest", "dep:tokio", "dep:url"]

[dependencies]
datastream-core.workspace = true
datastream-kafka = { path = "../kafka", version = "0.1.0", optional = true }
flate2 = "1"
futures = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde_json.workspace = true
tokio = { workspace = true, optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
async-stream.workspace = true
criterion.workspace = true
proptest.workspace = true
tokio.workspace = true
wiremock = "0.6"

[[bench]]
name = "index"
harness = false
