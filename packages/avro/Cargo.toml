[package]
name = "datastream-avro"
description = "Apache Avro encode/decode streams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Decode `datastream-schema-registry` unframe envelopes per schema id.
schema-registry = ["dep:datastream-schema-registry"]

[dependencies]
async-stream.workspace = true
datastream-core.workspace = true
datastream-schema-registry = { path = "../schema-registry", version = "0.1.0", optional = true }
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tokio.workspace = true

[[bench]]
name = "index"
harness = false
